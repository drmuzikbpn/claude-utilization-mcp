# XcodeGen spec. The .xcodeproj is generated (`xcodegen generate`) and never committed.
name: UsageDeck

options:
  bundleIdPrefix: com.evenseal
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  UsageCore:
    path: Packages/UsageCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  UsageDeck:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: UsageCore
      - target: UsageWidgets
      - target: UsageDeckWatch
    entitlements:
      path: App/UsageDeck.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.evenseal.usagedeck
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Usage Deck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        NSLocalNetworkUsageDescription: Usage Deck connects to the devices you pair on your local network to read Claude usage and pause sessions.
        NSCameraUsageDescription: Usage Deck uses the camera to scan the pairing code shown by `claude-usage pair`.
        CFBundleURLTypes:
          - CFBundleURLName: com.evenseal.usagedeck.pair
            CFBundleURLSchemes:
              - usagedeck
        BGTaskSchedulerPermittedIdentifiers:
          - com.evenseal.usagedeck.refresh
        UIBackgroundModes:
          - fetch
        UIAppFonts:
          - barlow_condensed_500.ttf
          - barlow_condensed_600.ttf
          - barlow_condensed_700.ttf
          - ibm_plex_sans_400.ttf
          - ibm_plex_sans_500.ttf
          - ibm_plex_sans_600.ttf
          - ibm_plex_mono_400.ttf
          - ibm_plex_mono_500.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evenseal.usagedeck
        TARGETED_DEVICE_FAMILY: "1"

  UsageDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AppUITests
    dependencies:
      - target: UsageDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evenseal.usagedeck.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete

  UsageDeckWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: SharedUI
    dependencies:
      - package: UsageCore
      - target: UsageComplications
    entitlements:
      path: Watch/UsageDeckWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.evenseal.usagedeck
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Usage Deck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.evenseal.usagedeck
        UIAppFonts:
          - BarlowCondensed-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evenseal.usagedeck.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"

  UsageWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: WidgetShared
      - path: SharedUI
    dependencies:
      - package: UsageCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/UsageWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.evenseal.usagedeck
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Usage Deck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - BarlowCondensed-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evenseal.usagedeck.widgets
        TARGETED_DEVICE_FAMILY: "1"

  UsageComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: Complications
      - path: WidgetShared
      - path: SharedUI
    dependencies:
      - package: UsageCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Complications/UsageComplications.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.evenseal.usagedeck
    info:
      path: Complications/Info.plist
      properties:
        CFBundleDisplayName: Usage Deck
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - BarlowCondensed-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evenseal.usagedeck.watchkitapp.complications
        TARGETED_DEVICE_FAMILY: "4"

  # Test-only: renders every widget / complication family to PNG (RenderTests/). Never shipped.
  UsageWidgetsRenderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RenderTests
      - path: WidgetShared
      - path: SharedUI
    dependencies:
      - package: UsageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evenseal.usagedeck.widgetrendertests
        GENERATE_INFOPLIST_FILE: YES

  UsageComplicationsRenderTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: RenderTests
      - path: WidgetShared
      - path: SharedUI
    dependencies:
      - package: UsageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evenseal.usagedeck.complicationrendertests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UsageDeck:
    build:
      targets:
        UsageDeck: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - UsageDeckUITests
    archive:
      config: Release
  UsageDeckWatch:
    build:
      targets:
        UsageDeckWatch: all
    run:
      config: Debug
  WidgetRender:
    build:
      targets:
        UsageWidgetsRenderTests: [test]
    test:
      targets:
        - UsageWidgetsRenderTests
  ComplicationRender:
    build:
      targets:
        UsageComplicationsRenderTests: [test]
    test:
      targets:
        - UsageComplicationsRenderTests
