#
# One file on the default branch covers every long-lived branch: Dependabot only reads
# `main`, and `target-branch` points an entry at the Android and iOS trees.
version: 2
updates:
  # --- main: the daemon ---------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint supports TypeScript below 6.1 only; lift this once it accepts 7.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Types track the oldest Node CI runs (22), so code cannot lean on newer APIs unnoticed.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule: { interval: weekly }

  # --- usage-android: the Android dashboard --------------------------------------
  - package-ecosystem: gradle
    directory: /
    target-branch: usage-android
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: usage-android
    schedule: { interval: weekly }

  # --- usage-ios: the iPhone and watch app ---------------------------------------
  - package-ecosystem: github-actions
    directory: /
    target-branch: usage-ios
    schedule: { interval: weekly }
