name: ios
# The iPhone + Apple Watch app lives on the `usage-ios` branch of the daemon's repo. Scoped to
# that branch on purpose (no wildcard): the daemon releases from `main`, the Android deck from
# `usage-android`. This workflow never creates a GitHub Release or tag — builds go to TestFlight
# only, so nothing here can appear in the daemon's `/releases/latest` (§23.17).
on:
  push: { branches: [usage-ios] }
  pull_request: { branches: [usage-ios] }
permissions: { contents: read }
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: brew install xcodegen swiftlint swiftformat
      - name: Lint
        run: swiftformat --lint . && swiftlint --strict --quiet
      - name: UsageCore tests
        run: swift test --package-path Packages/UsageCore
      - run: xcodegen generate
      - name: Build iPhone app (with widgets and the watch app)
        run: xcodebuild -project UsageDeck.xcodeproj -scheme UsageDeck -destination 'generic/platform=iOS Simulator' build -quiet
      - name: Build watch app
        run: xcodebuild -project UsageDeck.xcodeproj -scheme UsageDeckWatch -destination 'generic/platform=watchOS Simulator' build -quiet

  testflight:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/usage-ios'
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: brew install xcodegen && pip3 install --break-system-packages cryptography
      - name: Signing available?
        id: signing
        env:
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
        run: |
          if [ -n "$ASC_KEY_P8" ] && [ -n "$DIST_P12_B64" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::No signing secrets; skipping the TestFlight upload."; fi
      - name: Distribution certificate into a throwaway keychain
        if: steps.signing.outputs.ok == 'true'
        env:
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$DIST_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -P "$RUNNER_TEMP/dist.p12"
      - name: App Store profiles
        if: steps.signing.outputs.ok == 'true'
        run: python3 ci/asc.py profiles "UsageDeck AppStore" "UsageWidgets AppStore" "UsageDeckWatch AppStore" "UsageComplications AppStore"
      - name: Archive, export and upload
        if: steps.signing.outputs.ok == 'true'
        run: |
          BUILD="$(git rev-list --count HEAD)"
          xcodegen generate
          xcodebuild -project UsageDeck.xcodeproj -scheme UsageDeck -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/UsageDeck.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD" archive -quiet
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/UsageDeck.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist ci/ExportOptions.plist -quiet
          mkdir -p "$RUNNER_TEMP/keys" && chmod 700 "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/keys" xcrun altool --upload-app -f "$RUNNER_TEMP/export/UsageDeck.ipa" \
            -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -P "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "::notice::Uploaded build $BUILD to TestFlight"
      - name: Remove the throwaway keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
