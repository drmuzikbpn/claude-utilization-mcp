name: ci
# The app lives on the `usage-deck` branch of the daemon's repo. Scoped to that branch on purpose
# (no wildcard): the daemon's own release job runs on `main` and must never race this one.
on: { push: { branches: [usage-deck] }, pull_request: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the retired `tools` package, which Google's
          # repository stopped serving in September 2026 and sdkmanager then fails outright.
          packages: platform-tools build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck :core:test :fakedaemon:test :app:testDebugUnitTest
      - name: Instrumented tests (API 29)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          script: ./gradlew :app:connectedDebugAndroidTest
      # Release only from usage-deck, and only once the signing secrets exist (see README › Releases);
      # without them the tests still gate the branch and nothing is published.
      - name: Signing available?
        if: github.ref == 'refs/heads/usage-deck'
        id: signing
        run: echo "ok=$([ -n "$SIGNING_KEYSTORE_B64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env: { SIGNING_KEYSTORE_B64: "${{ secrets.SIGNING_KEYSTORE_B64 }}" }
      - name: Decode keystore
        if: steps.signing.outputs.ok == 'true'
        run: echo "$SIGNING_KEYSTORE_B64" | base64 -d > /tmp/release.jks
        env: { SIGNING_KEYSTORE_B64: "${{ secrets.SIGNING_KEYSTORE_B64 }}" }
      - name: Assemble release (unsigned)
        if: steps.signing.outputs.ok == 'true'
        run: ./gradlew :app:assembleRelease
      # apksigner rather than Gradle: the phone was provisioned with a debug-signed build, and only
      # a v3 signature carrying app/signing/usage-deck.lineage (debug key → release key) installs
      # over it in place, keeping Device Owner and the pairing. v1/v2 are off because minSdk is 29
      # and both would need the retired debug key present at signing time.
      - name: Sign release
        if: steps.signing.outputs.ok == 'true'
        run: |
          set -x
          BT="$ANDROID_HOME/build-tools/34.0.0"   # the version the lineage and the phone were verified with
          ls "$BT/zipalign" "$BT/apksigner"
          printf '%s' "$SIGNING_STORE_PASSWORD" > /tmp/store.pw
          "$BT/zipalign" -p 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/release.jks --ks-pass file:/tmp/store.pw --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --lineage app/signing/usage-deck.lineage --rotation-min-sdk-version 28 \
            --v1-signing-enabled false --v2-signing-enabled false --v3-signing-enabled true \
            --out usage-deck.apk /tmp/aligned.apk
          "$BT/apksigner" verify --print-certs -v usage-deck.apk
          rm -f /tmp/store.pw /tmp/release.jks /tmp/aligned.apk
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      - name: Version
        if: steps.signing.outputs.ok == 'true'
        id: v
        run: echo "version=0.1.$(git rev-list --count HEAD)+$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # Spec §23.17: tag `deck-<version>`, assets `usage-deck.apk` + `usage-deck.apk.sha256`, always a
      # pre-release so the daemon's /releases/latest never returns an APK.
      - name: Package
        if: steps.signing.outputs.ok == 'true'
        run: sha256sum usage-deck.apk > usage-deck.apk.sha256
      - name: Release
        if: steps.signing.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: deck-${{ steps.v.outputs.version }}
          name: Usage Deck ${{ steps.v.outputs.version }}
          prerelease: true
          files: |
            usage-deck.apk
            usage-deck.apk.sha256
