name: CI
on:
  push: { branches: [main, dev] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy: { matrix: { os: [ubuntu-latest, macos-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The commit-time check, run again where it cannot be skipped: every line this
      # change adds, against the base it is being merged into.
      - name: public-check
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # The checkout is the PR merged into its base, so base..HEAD is exactly what the
          # pull request adds.
          git fetch --no-tags --depth=1 origin "$BASE"
          git diff --no-color --no-ext-diff -U0 --diff-filter=ACMR "$BASE" HEAD > "$RUNNER_TEMP/pr.diff"
          bash scripts/public-check.sh --diff "$RUNNER_TEMP/pr.diff"
