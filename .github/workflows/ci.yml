name: ios
# The iPhone + Apple Watch app lives on the `usage-ios` branch of the daemon's repo. Scoped to
# that branch on purpose (no wildcard): the daemon releases from `main`, the Android deck from
# `usage-android`. This workflow never creates a GitHub Release or tag — builds go to TestFlight
# only, so nothing here can appear in the daemon's `/releases/latest` (§23.17).
#
# Every action is pinned to a full commit SHA (the tag is in the trailing comment) and every
# tool to a version and a SHA-256 (ci/install-tools.sh). Nothing is installed with pip.
on:
  push: { branches: [usage-ios] }
  pull_request: { branches: [usage-ios] }
permissions: { contents: read }
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs for pull requests too, so it holds no secret and can only read the repository.
  test:
    runs-on: macos-26
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      - name: Pinned build tools
        run: ci/install-tools.sh "$RUNNER_TEMP/tools" lint && echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: |
          swiftformat --lint .
          swiftlint --strict --quiet
          scripts/check-license-headers.sh
          scripts/public-check.sh --self-test
          python3 ci/es256.py --self-test
      - name: UsageCore tests
        run: swift test --package-path Packages/UsageCore
      - run: xcodegen generate
      - name: Build iPhone app (with widgets and the watch app)
        run: xcodebuild -project UsageDeck.xcodeproj -scheme UsageDeck -destination 'generic/platform=iOS Simulator' build -quiet
      - name: Build watch app
        run: xcodebuild -project UsageDeck.xcodeproj -scheme UsageDeckWatch -destination 'generic/platform=watchOS Simulator' build -quiet

  testflight:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/usage-ios'
    runs-on: macos-26
    # The signing secrets live in this environment, so only this job on this branch can read
    # them, and the environment's own protection rules (reviewers, branch limits) apply.
    environment: release-ios
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with: { xcode-version: latest-stable }
      - name: Pinned build tools
        run: ci/install-tools.sh "$RUNNER_TEMP/tools" && echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Signing available?
        id: signing
        env:
          # Only whether each secret is set reaches this step, never its value.
          HAS_ASC_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
          HAS_CERTIFICATE: ${{ secrets.DIST_P12_B64 != '' }}
        run: |
          if [ "$HAS_ASC_KEY" = "true" ] && [ "$HAS_CERTIFICATE" = "true" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::notice::No signing secrets; skipping the TestFlight upload."; fi
      - name: Distribution certificate into a throwaway keychain
        if: steps.signing.outputs.ok == 'true'
        env:
          DIST_P12_B64: ${{ secrets.DIST_P12_B64 }}
          DIST_P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$DIST_P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046 # the existing keychains are separate arguments on purpose
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -P "$RUNNER_TEMP/dist.p12"
      - name: App Store profiles
        if: steps.signing.outputs.ok == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 ci/asc.py profiles "UsageDeck AppStore" "UsageWidgets AppStore" "UsageDeckWatch AppStore" "UsageComplications AppStore"
      - name: Archive and export
        if: steps.signing.outputs.ok == 'true'
        run: |
          # Build number = (run number + 1000) x 10 + attempt. The run number only ever goes up
          # (the commit count did not: a squash merge shortened history, and build 28 went up
          # after 29) and a re-run gets its own number. The 1000 is there because the
          # repository was recreated, which restarted its run numbers at 1: the last build from
          # the old repository was run 110 (build 110x), and TestFlight refuses a number that
          # does not increase, so the first run here is build 10011. Never lower the offset.
          BUILD="$(( (GITHUB_RUN_NUMBER + 1000) * 10 + GITHUB_RUN_ATTEMPT ))"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          xcodegen generate
          xcodebuild -project UsageDeck.xcodeproj -scheme UsageDeck -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/UsageDeck.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD" archive -quiet
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/UsageDeck.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist ci/ExportOptions.plist -quiet
      - name: Upload to TestFlight
        if: steps.signing.outputs.ok == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys" && chmod 700 "$RUNNER_TEMP/keys"
          ( umask 077 && printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" )
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/keys" xcrun altool --upload-app -f "$RUNNER_TEMP/export/UsageDeck.ipa" \
            -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::Uploaded build $BUILD to TestFlight"
      - name: Remove the signing keychain and every key file
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          for f in "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP"/keys/*.p8; do
            [ -f "$f" ] && rm -P "$f"
          done
          rm -rf "$RUNNER_TEMP/keys" "$RUNNER_TEMP/UsageDeck.xcarchive" "$RUNNER_TEMP/export"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision \
            "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision
          true
