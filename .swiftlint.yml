included:
  - App
  - AppUITests
  - Watch
  - Widgets
  - Complications
  - SharedUI
  - WidgetShared
  - RenderTests
  - Packages/UsageCore/Sources
  - Packages/UsageCore/Tests
excluded:
  - Packages/UsageCore/.build
  - DerivedData
  - build

disabled_rules:
  - identifier_name        # i, a, b, x, y in tight loops and comparators
  - trailing_comma         # swiftformat owns commas
  - opening_brace          # swiftformat owns wrapping
  - function_body_length   # the Kotlin port keeps its long, linear functions
  - type_body_length
  - file_length
  - large_tuple
  - nesting
  - todo                   # replaced by the stricter custom rule below
  - optional_data_string_conversion # String(decoding:as:) is the lossless form we want

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - redundant_nil_coalescing

line_length:
  warning: 140
  error: 160
  ignores_comments: true
  ignores_urls: true
  ignores_multiline_strings: true

cyclomatic_complexity:
  warning: 20

force_try:
  severity: warning

custom_rules:
  no_todo:
    name: "No TODO/FIXME"
    regex: "\\b(TODO|FIXME)\\b"
    message: "No TODO/FIXME in committed code: do it, or record it in the spec's deferred list."
    severity: error
  no_token_logging:
    name: "Never log a token"
    regex: "(print|NSLog|os_log|logger\\.[a-z]+)\\([^)]*\\btoken\\b"
    message: "Bearer tokens must never be printed or logged."
    severity: error
  # SwiftUI draws a string literal as Markdown, interpolations included, so a device name, a
  # session title or an address in one could plant a link or restyle a warning. Text that holds a
  # value goes through Text(verbatim:) (or a DeckText); Markdown is for whole literals only.
  no_interpolated_markdown:
    name: "Interpolated text is drawn as Markdown"
    included: "(App|Watch|WidgetShared|Widgets|Complications|SharedUI)/.*\\.swift"
    regex: "\\b(Text|Label|Button|Toggle|Picker|Link|Section|ProgressView|Menu|LabeledContent|TextField|SecureField|SharePreview|DisclosureGroup|NavigationLink|Stepper|DatePicker|Gauge|Announcement|DisplayRepresentation)\\(\\s*+(?!verbatim:)(?:[^\\n]*|[^\")]{0,300})\"[^\"\\n]*\\\\\\("
    message: "A literal with an interpolation is parsed as Markdown: use Text(verbatim:) or a DeckText."
    severity: error
  no_interpolated_markdown_modifier:
    name: "Interpolated text is drawn as Markdown"
    included: "(App|Watch|WidgetShared|Widgets|Complications|SharedUI)/.*\\.swift"
    regex: "\\.(navigationTitle|accessibilityLabel|accessibilityValue|accessibilityHint|alert|confirmationDialog|help|badge)\\(\\s*+(?!Text\\(\\s*verbatim:)(?:[^\\n]*|[^\")]{0,300})\"[^\"\\n]*\\\\\\("
    message: "A literal with an interpolation is parsed as Markdown: pass Text(verbatim:)."
    severity: error
  no_markdown_from_variable:
    name: "Markdown only from a literal"
    included: "(App|Watch|WidgetShared|Widgets|Complications|SharedUI)/.*\\.swift"
    regex: "LocalizedStringKey\\(\\s*[^\"\\s]"
    message: "LocalizedStringKey(variable) draws the variable as Markdown: use Text(verbatim:) or a DeckText."
    severity: error
