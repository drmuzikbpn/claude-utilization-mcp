# gitleaks runs from scripts/public-check.sh when it is installed. The only exemption is
# that script's own fixtures, which exist to be full of credential-shaped strings.
[extend]
useDefault = true

[allowlist]
description = "public-check self-test fixtures"
paths = ['''test/fixtures/public-check/''']
