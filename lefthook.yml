pre-commit:
  parallel: true
  commands:
    swiftformat:
      glob: "*.swift"
      run: swiftformat --lint {staged_files}
    swiftlint:
      glob: "*.swift"
      run: swiftlint lint --strict --quiet {staged_files}
    public-check:
      run: scripts/public-check.sh
    # GitGuardian's secret scanner, when it is installed and signed in (`ggshield auth login`).
    ggshield:
      run: if command -v ggshield >/dev/null 2>&1; then ggshield secret scan pre-commit; else echo "ggshield not installed - skipped"; fi
    licence-headers:
      glob: "*.{swift,sh,py,yml,yaml}"
      run: scripts/check-license-headers.sh {staged_files}
    usagecore-build:
      glob: "Packages/UsageCore/**/*.swift"
      run: swift build --package-path Packages/UsageCore

pre-push:
  commands:
    marketing-version:
      run: ci/check-version.sh
