pre-commit:
  parallel: true
  commands:
    lint:
      run: npx eslint .
    typecheck:
      run: npx tsc --noEmit
    # Nothing private reaches a public repository: see CONTRIBUTING.md.
    public-check:
      run: bash scripts/public-check.sh
    # GitGuardian's secret scanner, when it is installed and signed in (`ggshield auth login`).
    # Skipped with a note otherwise; public-check above still runs.
    ggshield:
      run: if command -v ggshield >/dev/null 2>&1; then ggshield secret scan pre-commit; else echo "ggshield not installed - skipped"; fi
